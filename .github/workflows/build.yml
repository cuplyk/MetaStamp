name: Build installers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the app and its installers
        working-directory: app
        run: cargo tauri build
      - name: Add the portable Windows .exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/release/bundle/portable | Out-Null
          Copy-Item target/release/metastamp.exe target/release/bundle/portable/MetaStamp_x64_portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: MetaStamp-${{ runner.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/portable/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
