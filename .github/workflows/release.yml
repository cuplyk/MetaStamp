name: Release

# Push a tag such as v0.1.0 to build the installers and the portable .exe and
# publish them as a GitHub Release. The tag must match the version in
# app/tauri.conf.json. Run it by hand (Actions > Release > Run workflow) with
# an existing tag to rebuild that release's files with this workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check that the tag matches the app version
        run: |
          app_version=$(jq -r .version app/tauri.conf.json)
          if [ "${TAG}" != "v${app_version}" ]; then
            echo "::error::Tag ${TAG} does not match app/tauri.conf.json version ${app_version}. Bump the version or tag v${app_version}."
            exit 1
          fi

  bundle:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the app and its installers
        working-directory: app
        run: cargo tauri build
      # The app binary embeds its interface, so on Windows it runs on its own
      # from any folder (it uses the WebView2 runtime that ships with Windows).
      - name: Add the portable Windows .exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force target/release/bundle/portable | Out-Null
          Copy-Item target/release/metastamp.exe "target/release/bundle/portable/MetaStamp_${version}_x64_portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: MetaStamp-${{ runner.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/portable/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MetaStamp ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.dmg
