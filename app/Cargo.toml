[package]
name = "metastamp"
version = "0.1.0"
edition = "2024"
description = "Edit Office document metadata (docProps/core.xml) and file timestamps"

[dependencies]
chrono = "0.4"
metastamp-core = { path = "../crates/metastamp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
